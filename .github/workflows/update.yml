name: Update WARN feed

on:
  schedule:
    - cron: "0 11 * * 1,4"   # Mon & Thu, 11:00 UTC (morning ET)
  workflow_dispatch:          # manual "Run workflow" button for testing

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Scrape PA DLI and rebuild feed
        run: python run.py

      - name: Commit and publish if changed
        run: |
          git config user.name "warn-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html warn_feed.json
          if git diff --cached --quiet; then
            echo "No new filings; nothing to publish."
          else
            git commit -m "Update WARN feed $(date -u +%F)"
            git push
          fi
